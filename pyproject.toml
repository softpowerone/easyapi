[project]
name = "easyapix"
version = "0.1.0"
description = "Lightweight ASGI framework for building MVP backends quickly"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lev" }]
keywords = ["asgi", "api", "framework", "web", "backend"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "uvicorn", "build", "twine"]

[project.urls]
Homepage = "https://github.com/softpowerone/easyapix"
Issues = "https://github.com/softpowerone/easyapix/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"